server:
  port: 8080

spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:app_db}
    username: ${DB_USER:app_user}
    password: ${DB_PASSWORD:changeme}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration

spring.ai.openai:
  base-url: https://openrouter.ai/api
  api-key: ${OPENROUTER_API_KEY:}
  chat:
    options:
      model: ${OPENROUTER_MODEL:anthropic/claude-sonnet-4}
